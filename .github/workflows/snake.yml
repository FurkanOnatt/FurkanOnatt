name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FurkanOnatt
          outputs: |
            dist/github-snake.svg?color_snake=%238B5CF6&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%238b5cf6,%236d28d9
            dist/github-snake-dark.svg?color_snake=%2322D3EE&color_dots=%23161b22,%23312e81,%234338ca,%237c3aed,%23a855f7

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
